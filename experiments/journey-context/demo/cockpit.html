<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>이번 길 · 차량 오디오</title>
<link rel="stylesheet" href="/cockpit.css"></head>
<body>
<div class="small-screen">차량 앱 영역 시안입니다.<br>분할 화면은 480 × 720 이상에서 확인하세요.</div>
<div class="cockpit">
<header><div class="brand">이번 길<span>오디오</span></div><span id="connection">SDK 연결 대기</span></header>
<main>
<section class="listen" aria-labelledby="heading">
<p class="context" id="context">경로 정보 없음 · 기본 추천</p>
<h1 id="heading">지금, 이야기 한 편 들어보세요</h1>
<div class="selection"><div class="audio-mark" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M10 27v10M21 17v30M32 9v46M43 21v22M54 27v10"/></svg></div><div><h2 id="content-title">이야기를 준비합니다</h2><p id="caption">짧은 이야기 · 추천 콘텐츠 예시</p></div></div>
<div class="controls"><button id="play" class="primary"><span class="glyph" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M8 4 28 16 8 28Z"/></svg></span><span id="play-label">바로 듣기</span></button><button id="stop" disabled><span class="glyph" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M6 6h20v20H6z"/></svg></span>듣기 종료</button></div>
</section>
<section class="voice" aria-labelledby="voice-heading" data-active="false">
<h2 id="voice-heading">음성으로 조작</h2><div class="voice-icon" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><rect x="23" y="5" width="18" height="33" rx="9"/><path d="M15 30v3a17 17 0 0 0 34 0v-3M32 50v9M24 59h16"/></svg></div>
<p id="voice-message" role="status">음성 인식 미연결</p><p class="sub" id="voice-detail">지금은 터치로 조작해 주세요</p><button id="voice" disabled>준비 중</button>
</section>
</main>
<footer><p id="status" role="status">시작하려면 ‘바로 듣기’를 누르세요</p><span>로컬 시연 · 실차 미검증</span></footer>
</div>
<audio id="audio" preload="metadata" hidden></audio><script type="module" src="/cockpit.mjs"></script></body></html>
